<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CannonSmash</title>
    <style>
      /* 기본 템플릿은 PC에서 캔버스를 960x600 고정으로 두고 아래에 로고 줄을
         붙여서, 창이 작으면 잘리고 세로 게임이 가로 틀에 들어갔다.
         여기서는 창 전체를 쓰고, PC에서는 세로 9:16(HudLayout 기준 1080x1920)을
         창 안에 꽉 맞춰 가운데 둔다. 폰은 화면 전체를 그대로 쓴다. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1F1F20; }
      #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #1F1F20; aspect-ratio: 9 / 16;
                      width: min(100vw, calc(100dvh * 9 / 16)); height: auto; max-height: 100dvh; }
      .mobile #unity-canvas { width: 100%; height: 100%; aspect-ratio: auto; max-height: none; }
      #unity-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                       width: 160px; height: 8px; border-radius: 4px; background: #3a3a3c; overflow: hidden; }
      #unity-loading-fill { width: 0%; height: 100%; background: #f0c040; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading"><div id="unity-loading-fill"></div></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.body.className = "mobile";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl.data.unityweb",
        frameworkUrl: buildUrl + "/webgl.framework.js.unityweb",
        codeUrl: buildUrl + "/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cozy Spark",
        productName: "CannonSmash",
        productVersion: "1.0.0",
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/webgl.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-loading-fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#unity-loading").style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
