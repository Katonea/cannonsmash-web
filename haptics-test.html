<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진동 점검</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0;
         padding: 20px; background: #16305c; color: #fff; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  
  pre { background: #0e2044; padding: 12px; border-radius: 8px; font-size: 13px;
        white-space: pre-wrap; word-break: break-all; }
  button { display: block; width: 100%; margin: 8px 0; padding: 18px;
           font-size: 18px; font-weight: 700; border: 0; border-radius: 12px;
           background: #3fb950; color: #fff; }
  button:active { background: #2ea043; }
  .note { opacity: .75; font-size: 14px; margin-top: 18px; }
</style>
<h1>진동 점검</h1>
<pre id="info">확인 중…</pre>
<button data-ms="12">12ms (부딪힘)</button>
<button data-ms="45">45ms (발사·깨짐)</button>
<button data-ms="90">90ms (클리어)</button>
<button data-ms="200">200ms</button>
<button data-ms="400">400ms</button>
<button id="pattern">패턴 (100-50-100)</button>
<button id="ios">iOS 스위치 방식</button>
<pre id="log"></pre>
<p class="note">버튼을 직접 눌러서 확인하세요. 각 버튼은 사용자 탭이라
사용자 활성화 조건을 확실히 만족합니다.</p>
<script>
  var out = document.getElementById("log");
  function log(t) { out.textContent = t + "\n" + out.textContent; }

  document.getElementById("info").textContent =
    "navigator.vibrate: " + (navigator.vibrate ? "있음" : "없음") + "\n" +
    "userAgent: " + navigator.userAgent;

  document.querySelectorAll("button[data-ms]").forEach(function (b) {
    b.addEventListener("click", function () {
      var ms = Number(b.dataset.ms);
      if (!navigator.vibrate) { log(ms + "ms: vibrate 없음"); return; }
      log(ms + "ms: vibrate(" + ms + ") -> " + navigator.vibrate(ms));
    });
  });

  document.getElementById("pattern").addEventListener("click", function () {
    if (!navigator.vibrate) { log("패턴: vibrate 없음"); return; }
    log("패턴: " + navigator.vibrate([100, 50, 100]));
  });

  // 게임이 iOS에서 쓰는 폴백과 같은 방법.
  var box = null;
  document.getElementById("ios").addEventListener("click", function () {
    if (!box) {
      box = document.createElement("input");
      box.type = "checkbox";
      box.setAttribute("switch", "");
      box.style.cssText = "position:absolute;left:-9999px;";
      document.body.appendChild(box);
    }
    box.checked = !box.checked;
    box.dispatchEvent(new Event("change", { bubbles: true }));
    log("iOS 스위치: 토글함 (switch 지원 " +
        (box.matches("input[switch]") ? "가능성 있음" : "확인 불가") + ")");
  });
</script>
